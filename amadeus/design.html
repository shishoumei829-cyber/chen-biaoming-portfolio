      <div class="detail-content">
        <h2>表达之前，先完成内部加工。</h2>
        <p>AMADEUS 的重点放在“为什么这样说”。每次生成前，系统先检索相关记忆，更新情绪状态，评估行为倾向，再把这些判断压缩成可执行的表达方向。</p>
        <p>这让人格拥有连续性：过去的互动会影响当下，情绪会改变语气，关系状态会限制表达边界，主动开口也有清晰触发条件。</p>
      </div>
    </section>
