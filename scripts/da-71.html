<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0eeea;
  --paper:#f5f3ef;
  --ink:#121018;
  --muted:#524e5c;
  --soft:#c8c4bc;
  --line:rgba(18,16,24,.14);
  --gold:#990000;
  --eva-red:#990000;
  --eva-red-glow:rgba(179,0,0,.42);
  --eva-crimson:#990000;
  --eva-crimson-lit:#b30000;
  --eva-blue:#0028b0;
  --eva-blue-mid:#0034c8;
  --eva-blue-ghost:#061850;
  --eva-black:#060606;
  --eva-paper:#f4f2ec;
  --eva-ink:#16141e;
  --eva-ink-soft:#5e5868;
  --eva-on-dark:rgba(244,242,238,.82);
  --eva-on-dark-dim:rgba(244,242,238,.5);
  --eva-matisse:"Bodoni Moda","Noto Serif SC",serif;
  --eva-caption:"Helvetica Neue",Arial,sans-serif;
  --eva-body:"Noto Serif SC",Georgia,serif;
  --blue:#6eb5d9;
  --rose:#c4919a;
  --black:#060606;
  --ease:cubic-bezier(.16,1,.3,1);
}
html{scroll-behavior:smooth}
body{
  min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:Inter,"Noto Serif SC",system-ui,sans-serif;
  overflow-x:hidden;cursor:none;
}
body::before{
  content:"";position:fixed;inset:0;z-index:999;pointer-events:none;opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::selection{background:rgba(153,0,0,.22);color:var(--ink)}
.cursor-dot,.cursor-ring{position:fixed;left:0;top:0;pointer-events:none;z-index:10000;transform:translate(-50%,-50%)}
.cursor-dot{width:6px;height:6px;border-radius:99px;background:var(--ink)}
.cursor-ring{width:38px;height:38px;border:1px solid rgba(18,16,13,.32);border-radius:99px;transition:width .35s var(--ease),height .35s var(--ease),border-color .35s var(--ease),background .35s var(--ease)}
.cursor-ring.big{width:74px;height:74px;border-color:rgba(184,154,101,.75);background:rgba(184,154,101,.08)}
body.dark-cursor .cursor-dot{background:#f8f3e8}
body.dark-cursor .cursor-ring{border-color:rgba(248,243,232,.35)}
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--eva-red);box-shadow:0 0 12px var(--eva-red-glow);z-index:9000}

.nav{
  position:fixed;z-index:8000;left:0;right:0;top:0;
  padding:24px clamp(22px,4vw,58px);display:flex;align-items:center;justify-content:space-between;
  color:#f8f3e8;mix-blend-mode:difference;
}
.brand{font-family:"Playfair Display",serif;font-style:italic;font-size:24px;letter-spacing:.04em}
.nav ul{display:flex;gap:clamp(16px,3vw,42px);list-style:none}
.nav a{font-size:11px;letter-spacing:.22em;text-transform:uppercase;position:relative}
.nav a::after{content:"";position:absolute;left:0;bottom:-5px;width:0;height:1px;background:currentColor;transition:width .35s var(--ease)}
.nav a:hover::after{width:100%}

.hero{
  min-height:108vh;position:relative;display:flex;align-items:flex-end;overflow:hidden;
  padding:140px clamp(24px,5vw,72px) 190px;
  background:#080807;color:#f8f3e8;
}
.hero-bg{position:absolute;inset:-8%;background:radial-gradient(circle at 18% 24%,rgba(184,154,101,.28),transparent 26%),radial-gradient(circle at 76% 24%,rgba(159,208,239,.20),transparent 30%),radial-gradient(circle at 64% 82%,rgba(196,145,154,.20),transparent 32%),#080807;opacity:1;transform:scale(1.08)}
.hero-vignette{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,8,7,.98),rgba(8,8,7,.72) 52%,rgba(8,8,7,.88)),radial-gradient(circle at 50% 46%,transparent 0%,rgba(0,0,0,.42) 72%)}
.hero-grid{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(to bottom,transparent,black 22%,black 72%,transparent)}
.hero-copy{position:relative;z-index:2;max-width:min(100%,1040px)}
.kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(248,243,232,.58);margin-bottom:18px}
.hero h1{font-family:"Playfair Display","Noto Serif SC",serif;font-size:clamp(76px,12vw,188px);line-height:.88;font-weight:700;letter-spacing:-.055em;max-width:min(100%,1100px)}
.hero h1 em{font-style:italic;color:#d9bb7e}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(28px,4vw,44px)}
.pill{border:1px solid rgba(248,243,232,.18);border-radius:999px;padding:10px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(248,243,232,.72);background:rgba(255,255,255,.04);backdrop-filter:blur(10px)}
.hero-index{
  position:absolute;left:clamp(24px,5vw,72px);right:clamp(24px,5vw,72px);bottom:46px;z-index:2;
  display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid rgba(248,243,232,.16);
  animation:floatIn 1.4s .4s var(--ease) both;
}
.hero-work{position:relative;padding:22px 28px 0 0;background:transparent;border:0;min-height:92px;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.hero-work:hover{transform:translateY(-4px);opacity:.78}
.hero-work::after{content:"";position:absolute;top:-1px;left:0;width:48px;height:1px;background:#d9bb7e}
.hero-work small{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#d9bb7e;margin-bottom:8px}
.hero-work h3{font-family:"Playfair Display","Noto Serif SC",serif;font-size:clamp(20px,2.2vw,30px);line-height:1;letter-spacing:-.03em}
.hero-work p{display:block;max-width:280px;margin-top:12px;font-size:12px;line-height:1.7;color:rgba(248,243,232,.52)}
@keyframes floatIn{from{opacity:0;transform:translateY(90px) scale(.92)}to{opacity:.95;transform:translateY(0) scale(1)}}

.section{position:relative;padding:clamp(78px,10vw,140px) clamp(22px,5vw,72px)}
.section.dark{background:#090908;color:#f8f3e8}
.section.light{background:var(--bg);color:var(--ink)}
.section-head{display:grid;grid-template-columns:minmax(180px,320px) 1fr;gap:clamp(28px,6vw,90px);align-items:end;margin-bottom:clamp(44px,7vw,86px)}
.num{font-family:"Playfair Display",serif;font-style:italic;font-size:15px;color:var(--gold)}
.section-title{font-family:"Playfair Display","Noto Serif SC",serif;font-size:clamp(38px,7vw,104px);line-height:.92;letter-spacing:-.045em}
.section-desc{max-width:560px;font-family:"Noto Serif SC",serif;font-size:14px;line-height:2.05;color:var(--muted);font-weight:300}
.dark .section-desc{color:rgba(248,243,232,.62)}
#mirage{padding:0 0 clamp(78px,10vw,140px)}
.mirage-head{position:relative;min-height:100vh;margin:0 0 clamp(70px,9vw,120px);padding:120px clamp(22px,5vw,72px);display:grid;grid-template-columns:1fr;place-items:center;text-align:center;overflow:hidden}
.mirage-head>div:nth-of-type(1){position:absolute;z-index:2;left:clamp(22px,5vw,72px);top:clamp(70px,8vw,110px)}
.mirage-head>div:last-child:not(.mirage-hero-stage){position:relative;z-index:2;display:grid;place-items:center}
.mirage-head .mirage-hero-stage{display:flex!important;flex-direction:column!important;align-items:center!important;place-items:unset!important}
.mirage-head .section-title{position:relative;z-index:2;font-size:clamp(64px,10vw,150px);text-shadow:0 8px 24px rgba(0,0,0,.42)}
.mirage-head .section-desc{position:relative;z-index:2;max-width:720px;margin-top:24px;color:rgba(248,243,232,.92);text-shadow:0 4px 16px rgba(0,0,0,.46)}
.mirage-hero-stage{
  position:relative;z-index:2;width:100%;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:clamp(8px,2vw,24px) 0 clamp(32px,5vw,56px);
  margin-top:clamp(8px,2vw,20px);
}
.mirage-product-float{
  position:relative;z-index:2;
  width:clamp(360px,74vw,920px);max-width:960px;
  margin:0 auto;pointer-events:none;
}
.mirage-product-float img{
  width:100%;height:auto;display:block;object-fit:contain;
  filter:drop-shadow(0 40px 80px rgba(0,0,0,.16));
}
.mirage-hero-stage .mirage-open-foot{
  position:relative;z-index:3;width:100%;max-width:760px;
  margin:clamp(18px,3vw,36px) auto 0;text-align:center;
}
.mirage-hero-stage.is-done .mirage-product-float img{
  animation:mirageFloat 5.5s ease-in-out infinite;
}
@keyframes mirageFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}
@media (prefers-reduced-motion:reduce){
  .mirage-hero-stage.is-done .mirage-product-float img{animation:none!important}
}

/* MIRAGE 瀹ｄ紶娴锋姤 路 鐢诲粖寮忛檲鍒?+ 婊氬姩瑙嗗樊 */
.mirage-poster-stage{
  position:relative;width:100%;max-width:min(680px,88vw);
  margin:0 auto clamp(56px,8vw,96px);
  min-height:clamp(1080px,200vh,1400px);
  padding:clamp(32px,5vw,56px) 0 clamp(16px,3vw,28px);
}
.mirage-poster-scene{
  position:sticky;top:clamp(72px,11vh,112px);
  width:100%;min-height:min(78vh,620px);
  perspective:1400px;perspective-origin:50% 46%;
}
.mirage-poster-atmo{
  position:absolute;inset:-32% -26% -22%;pointer-events:none;z-index:0;overflow:visible;
}
.mirage-poster-atmo__sky{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% 16%,rgba(196,224,255,.78),transparent 54%),
    radial-gradient(ellipse at 18% 68%,rgba(255,255,255,.62),transparent 44%),
    linear-gradient(180deg,#e8f0fc 0%,#f8f6f2 58%,#f3efe8 100%);
  transform:translate3d(0,var(--ppy,0),0);
  will-change:transform;
}
.mirage-poster-atmo__mist{
  position:absolute;inset:8% -10% -8%;
  background:
    radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.88),transparent 60%),
    radial-gradient(ellipse at 14% 38%,rgba(214,232,255,.48),transparent 38%);
  filter:blur(20px);
  transform:translate3d(0,var(--ppy,0),0);
  will-change:transform;
}
.mirage-poster-atmo__glow{
  position:absolute;left:50%;top:44%;width:min(92%,540px);aspect-ratio:1;border-radius:50%;
  transform:translate3d(-50%,calc(-50% + var(--ppy,0px)),0);
  background:radial-gradient(circle,rgba(120,168,255,.28),transparent 70%);
  filter:blur(10px);will-change:transform;
}
.mirage-poster-atmo__cloud{
  position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.82),transparent 72%);
  filter:blur(14px);
  transform:translate3d(var(--ppx,0),var(--ppy,0),0);
  will-change:transform;
}
.mirage-poster-atmo__cloud--1{left:-8%;top:10%;width:48%;height:24%;opacity:.85}
.mirage-poster-atmo__cloud--2{right:-10%;top:26%;width:42%;height:20%;opacity:.72}
.mirage-poster-atmo__cloud--3{left:18%;bottom:6%;width:56%;height:22%;opacity:.58}
.mirage-poster-plinth{
  position:relative;z-index:2;width:100%;
  transform-style:preserve-3d;
  will-change:transform,opacity;
}
.mirage-poster-plinth::before{
  content:"";position:absolute;left:8%;right:8%;bottom:-18px;height:28px;z-index:0;
  background:radial-gradient(ellipse,rgba(0,40,120,.16),transparent 72%);
  filter:blur(10px);transform:translateZ(-40px);
}
.mirage-poster-mat{
  position:relative;padding:clamp(10px,2.2vw,16px);
  background:linear-gradient(145deg,#fff,#f6f8fc);
  border:1px solid rgba(0,40,176,.08);
  box-shadow:
    0 1px 0 rgba(255,255,255,.95) inset,
    0 28px 64px rgba(0,40,120,.12),
    0 8px 24px rgba(0,0,0,.06);
  overflow:hidden;
}
.mirage-poster-art{margin:0;line-height:0;background:#eef2f8}
.mirage-poster-art img{
  display:block;width:100%;height:auto;
  filter:saturate(1.02) contrast(1.01);
  transform:translate3d(0,var(--img-y,0),0) scale(var(--img-scale,1));
  will-change:transform;
}
.mirage-poster-shine{
  position:absolute;inset:clamp(10px,2.2vw,16px);z-index:3;pointer-events:none;
  background:linear-gradient(118deg,transparent 36%,rgba(255,255,255,.34) 49%,transparent 62%);
  mix-blend-mode:soft-light;opacity:.55;
  transform:translate3d(0,var(--ppy-shine,0),0);
}
.mirage-poster-plinth.is-lit .mirage-poster-mat{
  box-shadow:
    0 1px 0 rgba(255,255,255,.95) inset,
    0 36px 88px rgba(0,40,120,.16),
    0 12px 32px rgba(0,0,0,.08);
}
@media (max-width:760px){
  .mirage-poster-stage{max-width:min(92vw,480px);min-height:clamp(820px,168vh,1040px)}
}
@media (prefers-reduced-motion:reduce){
  .mirage-poster-plinth{opacity:1!important}
}
.mirage-cases,.spec-showcase{margin-left:clamp(22px,5vw,72px);margin-right:clamp(22px,5vw,72px)}

.mirage-cases{display:grid;gap:clamp(38px,7vw,96px)}
.mirage-case{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,5vw,70px);align-items:center;min-height:82vh}
.mirage-case:nth-child(even){grid-template-columns:.95fr 1.05fr}
.mirage-case:nth-child(even) .case-visual{order:2}
.case-visual{position:relative;border-radius:34px;overflow:hidden;background:#fff;box-shadow:0 44px 130px rgba(0,0,0,.46);transform-style:preserve-3d;transition:transform .8s var(--ease)}
.case-visual:hover{transform:translateY(-12px) rotateX(3deg) rotateY(-5deg)}
.case-visual img{width:100%;height:auto}
.case-visual::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0%,rgba(255,255,255,.22) 48%,transparent 58%);transform:translateX(-120%);transition:transform 1s var(--ease)}
.case-visual:hover::after{transform:translateX(120%)}
.case-copy{max-width:560px}
.case-index{font-family:"Playfair Display",serif;font-style:italic;color:#d9bb7e;font-size:15px;margin-bottom:28px}
.case-copy h3{font-family:"Playfair Display","Noto Serif SC",serif;font-size:clamp(30px,4vw,52px);line-height:1.08;letter-spacing:-.03em;margin-bottom:26px}
.case-lead{font-family:"Noto Serif SC",serif;font-size:15px;line-height:2.05;color:rgba(248,243,232,.72);font-weight:300}
.case-list{display:grid;gap:14px;margin-top:28px}
.case-list div{padding-top:14px;border-top:1px solid rgba(248,243,232,.12)}
.case-list strong{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#d9bb7e;margin-bottom:7px}
.case-list span{display:block;font-family:"Noto Serif SC",serif;font-size:13px;line-height:1.85;color:rgba(248,243,232,.58)}

.thought-page{
  --thought-ink:#f8f3e8;--thought-muted:rgba(248,243,232,.62);--thought-accent:#cce8dc;--thought-soft:#cfa3aa;
  position:relative;min-height:82vh;margin:clamp(34px,5vw,70px) clamp(22px,5vw,72px);
  display:grid;align-items:center;overflow:hidden;color:var(--thought-ink);
}
.thought-page::before{
  content:"";position:absolute;inset:6% -8%;z-index:0;pointer-events:none;opacity:.52;
  background:radial-gradient(circle at 18% 24%,rgba(255,250,240,.14),transparent 25%),radial-gradient(circle at 78% 28%,rgba(204,232,220,.15),transparent 30%),radial-gradient(circle at 66% 82%,rgba(207,163,170,.16),transparent 32%);
  filter:blur(14px);
}
.thought-copy{position:relative;z-index:1;max-width:1050px}
.thought-kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--thought-soft);margin-bottom:24px}
.thought-line{
  font-family:"Playfair Display","Noto Serif SC",serif;font-size:clamp(48px,8vw,126px);
  line-height:.98;letter-spacing:-.055em;white-space:pre-line;min-height:2em;
}
.thought-sub{
  max-width:660px;margin-top:34px;font-family:"Noto Serif SC",serif;font-size:clamp(14px,1.5vw,18px);
  line-height:2.05;color:var(--thought-muted);font-weight:300;opacity:0;transform:translateY(16px);
  transition:opacity .9s var(--ease),transform .9s var(--ease);
}
.thought-page.typed .thought-sub{opacity:1;transform:none}
.thought-page.align-right .thought-copy{margin-left:auto;text-align:right}.thought-page.align-right .thought-sub{margin-left:auto}
.thought-page.narrow .thought-copy{max-width:760px;margin-left:9vw}
.thought-page.split-thought{grid-template-columns:.78fr 1.22fr;gap:clamp(28px,5vw,70px)}
.thought-aside{position:relative;z-index:1;align-self:end;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(248,243,232,.36);writing-mode:vertical-rl}
.thought-page.light{--thought-ink:#1a1517;--thought-muted:rgba(26,21,23,.62);--thought-accent:#5d9d86;--thought-soft:#a66f78;margin-top:0;margin-bottom:clamp(26px,4vw,58px)}
.thought-page.light::before{opacity:.88;background:radial-gradient(circle at 20% 22%,rgba(255,250,240,.72),transparent 25%),radial-gradient(circle at 82% 28%,rgba(204,232,220,.48),transparent 30%),radial-gradient(circle at 70% 82%,rgba(207,163,170,.24),transparent 32%)}
.thought-page.light .thought-kicker{color:var(--thought-soft)}
.type-caret::after{content:"";display:inline-block;width:.08em;height:.82em;margin-left:.08em;background:currentColor;animation:blink .9s steps(2,start) infinite;vertical-align:-.08em}
@keyframes blink{50%{opacity:0}}

.spec-showcase{margin-top:90px;display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:stretch}
.spec-img{border-radius:30px;overflow:hidden;background:#fff;min-height:520px;box-shadow:0 28px 90px rgba(0,0,0,.38)}
.spec-img img{width:100%;height:100%;object-fit:cover}
.spec-copy{border:1px solid rgba(248,243,232,.12);border-radius:30px;padding:clamp(28px,4vw,52px);display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.015))}
.spec-copy h3{font-family:"Playfair Display","Noto Serif SC",serif;font-size:clamp(36px,5vw,70px);line-height:.95;letter-spacing:-.035em}
.spec-list{display:grid;gap:16px;margin-top:38px}
.spec-row{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid rgba(248,243,232,.12);padding-bottom:14px;font-size:13px;color:rgba(248,243,232,.68)}
.spec-row strong{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#d9bb7e}

.timewalker{
  --tw-paper:#f3efe4;
  --tw-paper-w:#faf7f0;
  --tw-ink:#1a1814;
  --tw-ink-m:#5c5650;
  --tw-ink-s:#9a9288;
  --tw-mist:rgba(26,24,20,.06);
  --tw-vermilion:#b83a32;
  --tw-vermilion-dim:rgba(184,58,50,.14);
  --tw-line:rgba(26,24,20,.10);
  --tw-bd:rgba(26,24,20,.08);
  background-color:var(--tw-paper);
  color:var(--tw-ink);
  overflow:hidden;
  padding:0!important;
}
.tw-chapter{position:relative}
.tw-chapter::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-color:var(--tw-paper);
  background-image:url("assets/timewalker/xuan-paper.png");
  background-size:cover;
  background-repeat:no-repeat;
  background-position:center center;

.da-layers--inline{

.da-layer{

  align-items:center;padding:18px 22px;border-radius:18px;
  background:rgba(255,255,255,.72);border:1px solid var(--da-line);

}

.da-layers.in .da-layer:nth-child(1){transition-delay:.06s}

  color:var(--da-sage);text-transform:uppercase;
}

}

  display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--da-sage),#a8b5a4);
  transform-origin:left;transform:scaleX(0);transition:transform 1.1s var(--ease);
}
.da-layers.in .da-layer:nth-child(1) .da-layer-bar i{transform:scaleX(.92)}

.da-layers.in .da-layer:nth-child(3) .da-layer-bar i{transform:scaleX(.78)}

.da-pbar{height:5px;border-radius:999px;background:#e6e2dc;overflow:hidden;margin-top:auto}
.da-pbar i{display:block;height:100%;width:68%;background:var(--da-sage);border-radius:999px}
.da-phone h4{
  font-family:"Noto Serif SC",serif;font-size:14px;margin-top:14px;font-weight:600;
}

<script>
const dot=document.getElementById('cursorDot');
const ring=document.getElementById('cursorRing');
let mx=0,my=0,rx=0,ry=0;
window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px'});
function cursorTick(){rx+=(mx-rx)*.14;ry+=(my-ry)*.14;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(cursorTick)}
cursorTick();
document.querySelectorAll('a,.magnetic,.feature,.app-card').forEach(el=>{
  el.addEventListener('mouseenter',()=>ring.classList.add('big'));
  el.addEventListener('mouseleave',()=>ring.classList.remove('big'));
  el.addEventListener('mousemove',e=>{
    if(!el.classList.contains('magnetic')) return;
    const r=el.getBoundingClientRect();
    const x=(e.clientX-r.left-r.width/2)/r.width;
    const y=(e.clientY-r.top-r.height/2)/r.height;
    el.style.transform=`translate3d(${x*10}px,${y*10}px,0)`;
  });
  el.addEventListener('mouseleave',()=>{el.style.transform=''});
});

function revealIn(el){el.classList.add('in')}
function primeReveal(){
  const vh=innerHeight;
  document.querySelectorAll('.reveal:not(.in)').forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.top<vh*.94&&r.bottom>vh*.04) revealIn(el);
  });
}
const revealObs=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      revealIn(entry.target);
      revealObs.unobserve(entry.target);
    }
  });
},{threshold:.06,rootMargin:'0px 0px -6% 0px'});
document.querySelectorAll('.reveal').forEach(el=>revealObs.observe(el));
const daLayers=document.getElementById('daLayers');
if(daLayers){
  const daLayerObs=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting) entry.target.classList.add('in');
    });
  },{threshold:.2});
  daLayerObs.observe(daLayers);
}
requestAnimationFrame(primeReveal);

const mirageHero=document.getElementById('mirageHeroStage');
const mirageHead=document.querySelector('#mirage .mirage-head');
const mirageLensPoster=document.getElementById('mirageLensPoster');
const mirageReduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
if(mirageHero) mirageHero.classList.add('is-done');
function getPosterParallax(){
  if(!mirageLensPoster) return {progress:0,shift:0};
  const scene=mirageLensPoster.querySelector('.mirage-poster-scene');
  const stageH=Math.max(mirageLensPoster.offsetHeight,innerHeight);
  const sceneH=scene?scene.offsetHeight:innerHeight*.78;
  const runway=Math.max(stageH-sceneH,innerHeight*.62);
  const anchor=mirageLensPoster.offsetTop-innerHeight*.12;
  const scrollIn=scrollY-anchor;
  const progress=Math.min(1,Math.max(0,scrollIn/runway));
  const shift=(progress-.5)*Math.min(runway*.92,760);
  return {progress,shift};
}
function updateMiragePosterParallax(){
  if(!mirageLensPoster) return;
  const motionScale=mirageReduceMotion.matches?0.55:1;
  const {progress,shift:rawShift}=getPosterParallax();
  const shift=rawShift*motionScale;
  mirageLensPoster.querySelectorAll('[data-poster-parallax]').forEach(el=>{
    const s=parseFloat(el.dataset.posterParallax||0);
    const y=shift*s;
    const x=shift*s*.62;
    if(el.classList.contains('mirage-poster-atmo__cloud')){
      el.style.setProperty('--ppy',`${y}px`);
      el.style.setProperty('--ppx',`${x}px`);
    }else{
      el.style.setProperty('--ppy',`${y}px`);
    }
  });
  const plinth=document.getElementById('miragePosterPlinth');
  if(plinth){
    const enter=Math.min(1,Math.max(0,progress*1.08));
    const rotX=((1-enter)*11+shift*.012)*motionScale;
    const rotY=(shift/innerHeight)*-16;
    const lift=((1-enter)*56-shift*.52)*motionScale;
    plinth.style.transform=`rotateX(${rotX}deg) rotateY(${rotY}deg) translate3d(0,${lift}px,0) scale(${0.8+enter*.2})`;
    plinth.style.opacity=String(0.42+enter*.58);
    plinth.classList.toggle('is-lit',enter>=0.52);
  }
  const img=mirageLensPoster.querySelector('.mirage-poster-art img');
  if(img){
    const iy=-shift*.26;
    img.style.setProperty('--img-y',`${iy}px`);
    img.style.setProperty('--img-scale',String(1.03+Math.min(.08,Math.abs(iy)*.00022)));
  }
  const shine=mirageLensPoster.querySelector('.mirage-poster-shine');
  if(shine) shine.style.setProperty('--ppy-shine',`${-shift*.14}px`);
}
let posterAnimQueued=false;
function queueMiragePosterParallax(){
  if(posterAnimQueued) return;
  posterAnimQueued=true;
  requestAnimationFrame(()=>{
    updateMiragePosterParallax();
    posterAnimQueued=false;
  });
}
if(mirageLensPoster){
  queueMiragePosterParallax();
  window.addEventListener('load',queueMiragePosterParallax,{passive:true});
  mirageReduceMotion.addEventListener('change',queueMiragePosterParallax);
}

function typeThought(el){
  if(el.dataset.typed==='true') return;
  el.dataset.typed='true';
  const text=el.dataset.typewriter||'';
  const page=el.closest('.thought-page');
  el.textContent='';
  el.classList.add('type-caret');
  let i=0;
  const speed=Number(el.dataset.speed||42);
  function tick(){
    el.textContent=text.slice(0,i);
    i+=1;
    if(i<=text.length){
      setTimeout(tick,text[i-2]==='\n'?speed*5:speed);
    }else{
      el.classList.remove('type-caret');
      if(page) page.classList.add('typed');
    }
  }
  tick();
}
const typeObs=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting) typeThought(entry.target);
  });
},{threshold:.42,rootMargin:'0px 0px -12% 0px'});
document.querySelectorAll('[data-typewriter]').forEach(el=>typeObs.observe(el));

const darkSections=[...document.querySelectorAll('.hero,.dark')];
const sectionNavLinks=[...document.querySelectorAll('.dock-nav a[href^="#"],.nav a[href^="#"]')];
const briefSectionIds=['#brief','#mirage','#amadeus','#timewalker','#digitalark','#self'];
function updateBriefAnchors(){
  if(!sectionNavLinks.length) return;
  const probe=scrollY+innerHeight*.34;
  let active='#brief';
  briefSectionIds.forEach(id=>{
    const el=document.querySelector(id);
    if(el && el.offsetTop<=probe) active=id;
  });
  sectionNavLinks.forEach(a=>a.classList.toggle('is-here',a.getAttribute('href')===active));
}
function onScroll(){
  const max=document.documentElement.scrollHeight-innerHeight;
  document.getElementById('progress').style.width=(scrollY/max*100)+'%';
  const parallaxScale=innerWidth>768?1:0.22;
  document.querySelectorAll('[data-speed]').forEach(el=>{
    const speed=parseFloat(el.dataset.speed||0);
    if(!speed||parallaxScale<=0){
      el.style.transform='';
      return;
    }
    el.style.transform=`translateY(${scrollY*speed*parallaxScale}px) scale(1.08)`;
  });
  const inDark=darkSections.some(sec=>{
    const r=sec.getBoundingClientRect();
    return r.top<innerHeight*.45 && r.bottom>innerHeight*.25;
  });
  document.body.classList.toggle('dark-cursor',inDark);
  updateBriefAnchors();
  queueMiragePosterParallax();
}
window.addEventListener('scroll',onScroll,{passive:true});
onScroll();
window.addEventListener('resize',queueMiragePosterParallax,{passive:true});

document.querySelectorAll('a[href^="#"]').forEach(a=>{
  a.addEventListener('click',e=>{
    const id=a.getAttribute('href');
    const t=document.querySelector(id);
    if(t){
      e.preventDefault();
      let top=t.getBoundingClientRect().top+scrollY;
      if(id==='#mirage'&&mirageHead){
        top=Math.max(0,mirageHead.getBoundingClientRect().top+scrollY-innerHeight+96);
      }
      scrollTo({top,behavior:'smooth'});
    }
  });
});

let amaLastSection='';
function amaMoveOrb(pos){
  if(!amaGuideOrb) return;
  ['pos-hero','pos-left','pos-right','pos-low','pos-center'].forEach(c=>amaGuideOrb.classList.remove(c));
  amaGuideOrb.classList.add(pos||'pos-hero','visible');
}
function amaPick(section){
  const pack=amaGuideLines[section]||amaGuideLines.intro;
  const line=pack.lines[Math.floor(Math.random()*pack.lines.length)];
  amaMoveOrb(pack.pos);
  if(amaGuideLine){
    amaGuideLine.style.opacity='0';
    amaGuideLine.style.transform='translateY(10px) scale(.98)';
    setTimeout(()=>{
      amaGuideLine.textContent=line;
      amaGuideLine.style.transition='opacity .42s var(--ease),transform .42s var(--ease)';
      amaGuideLine.style.opacity='1';
      amaGuideLine.style.transform='none';
    },160);
  }
  if(amaGuideState) amaGuideState.textContent=pack.state;
}
const amaObs=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(!entry.isIntersecting) return;
    const section=entry.target.dataset.amaSection;
    if(section&&section!==amaLastSection){
      amaLastSection=section;
      amaPick(section);
    }
  });
},{threshold:.42,rootMargin:'-10% 0px -26% 0px'});
document.querySelectorAll('[data-ama-section]').forEach(el=>amaObs.observe(el));
